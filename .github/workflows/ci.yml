name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --python $(which python) -e ".[dev]"
      - name: Ruff check
        run: python -m ruff check src/aminopstwin tests/

  types:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --python $(which python) -e ".[dev]"
      - name: mypy --strict
        env:
          MYPYPATH: src
        run: |
          python -m mypy --strict \
            --package aminopstwin.contracts \
            --package aminopstwin.gateway \
            --package aminopstwin.executor \
            --package aminopstwin.tokens \
            --package aminopstwin.twin \
            --package aminopstwin.evidence \
            --package aminopstwin.assurance \
            --package aminopstwin.dashboard \
            --package aminopstwin.enterprise \
            --package aminopstwin.integration

  test:
    name: Test (pytest + coverage)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --python $(which python) -e ".[dev]"
      - name: Pytest
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest -q --tb=short --no-header
      - name: Cross-platform oracle hash
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest tests/twin/test_cross_platform_oracle.py -v --no-cov

  security:
    name: Security (gitleaks, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --python $(which python) -e ".[dev]"
      - name: gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: pip-audit
        run: pip-audit --strict

  arch:
    name: Architecture (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --python $(which python) -e ".[dev]"
      - name: uv lock check
        run: uv lock --check
      - name: import-linter
        run: lint-imports
