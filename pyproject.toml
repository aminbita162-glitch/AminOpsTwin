[project]
name = "aminopstwin"
version = "0.1.0"
description = "Operational Cognitive Digital Twin for Clinical Research Operations (non-medical)"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Amin Azimi", email = "azimilab2025@gmail.com" }]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "pydantic>=2.9.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "networkx>=3.3.0,<4.0.0",
    "simpy>=4.1.0,<5.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "hypothesis>=6.112.0,<7.0.0",
    "mutmut>=2.5.0,<3.0.0",
    "schemathesis>=3.36.0,<4.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<3.0.0",
    "import-linter>=2.1.0,<3.0.0",
    "cyclonedx-bom>=4.0.0,<5.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aminopstwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "smoke: subset of fast smoke tests for bisectability checks",
]
addopts = "--cov --cov-report=term-missing --cov-report=html:htmlcov --strict-markers"

[tool.coverage.run]
source = ["src/aminopstwin"]
branch = true
omit = ["**/__init__.py"]

[tool.ruff]
target-version = "py312"
src = ["src/aminopstwin", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "DTZ", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now" = { msg = "Use injected Clock, not datetime.now() (deterministic core)" }
"uuid.uuid4" = { msg = "Use injected IdFactory, not uuid.uuid4() (deterministic core)" }
"random.random" = { msg = "Use seeded random.Random, not random.random() (deterministic core)" }
"random.randint" = { msg = "Use seeded random.Random, not random.randint() (deterministic core)" }
"random.choice" = { msg = "Use seeded random.Random, not random.choice() (deterministic core)" }
"os.urandom" = { msg = "Use injected IdFactory, not os.urandom() (deterministic core)" }
"secrets.token_bytes" = { msg = "Use injected IdFactory, not secrets.token_bytes() (deterministic core)" }

[tool.ruff.lint.per-file-ignores]
# System implementations legitimately use the banned APIs at the runtime edge
"src/aminopstwin/contracts/clock.py" = ["TID251"]
"src/aminopstwin/contracts/idfactory.py" = ["TID251"]
# Non-deterministic operational modules use uuid/datetime at the runtime edge
"src/aminopstwin/executor/__init__.py" = ["TID251"]
"src/aminopstwin/assurance/report.py" = ["TID251"]
"src/aminopstwin/enterprise/evaluation.py" = ["TID251"]
"src/aminopstwin/enterprise/transparency.py" = ["TID251"]
"src/aminopstwin/ingestion/shadow_gateway.py" = ["TID251"]
"src/aminopstwin/integration/exports.py" = ["TID251"]
"src/aminopstwin/integration/integration.py" = ["TID251"]
"src/aminopstwin/tokens/llm_adapter.py" = ["TID251"]
"src/aminopstwin/twin/pipeline.py" = ["TID251"]
"src/aminopstwin/fixtures_gen/__init__.py" = ["TID251"]
"src/aminopstwin/retention.py" = ["TID251"]
# Test files may use uuid.uuid4, datetime constructors, and naive datetimes
"tests/**" = ["DTZ001", "TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aminopstwin.contracts", "aminopstwin.gateway", "aminopstwin.executor", "aminopstwin.agents", "aminopstwin.tokens", "aminopstwin.twin", "aminopstwin.evidence", "aminopstwin.assurance", "aminopstwin.dashboard", "aminopstwin.enterprise", "aminopstwin.integration", "aminopstwin.priors", "aminopstwin.ingestion", "aminopstwin.shadow_pilot", "aminopstwin.fixtures_gen", "aminopstwin.api", "aminopstwin.policy_simulation", "aminopstwin.retention", "aminopstwin.scheduling", "aminopstwin.stage_seal", "aminopstwin.stage4_seal"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "simpy.*"
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["aminopstwin"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Gateway purity: no LLM-library or network imports"
type = "forbidden"
source_modules = ["aminopstwin.gateway"]
forbidden_modules = [
    "openai",
    "anthropic",
    "langchain",
    "langchain_core",
    "transformers",
    "httpx",
    "requests",
    "aiohttp",
    "httpcore",
    "urllib",
    "urllib3",
    "socket",
]

[[tool.importlinter.contracts]]
name = "Layer independence: contracts < gateway < executor < agents"
type = "layers"
layers = [
    "aminopstwin.agents",
    "aminopstwin.executor",
    "aminopstwin.gateway",
    "aminopstwin.contracts",
]
