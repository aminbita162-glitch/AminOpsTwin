[project]
name = "aminopstwin"
version = "0.1.0"
description = "Operational Cognitive Digital Twin for Clinical Research Operations (non-medical)"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Amin Azimi", email = "noreply@azimi-innovation-lab.example" }]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "pydantic>=2.9.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "networkx>=3.3.0,<4.0.0",
    "simpy>=4.1.0,<5.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "hypothesis>=6.112.0,<7.0.0",
    "mutmut>=2.5.0,<3.0.0",
    "schemathesis>=3.36.0,<4.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "import-linter>=2.1.0,<3.0.0",
    "cyclonedx-bom>=4.0.0,<5.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "smoke: subset of fast smoke tests for bisectability checks",
]
addopts = "--cov --cov-report=term-missing --cov-report=html:htmlcov --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["**/__init__.py"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src.contracts", "src.gateway", "src.executor", "src.tokens", "src.twin", "src.evidence", "src.assurance", "src.dashboard", "src.enterprise", "src.integration"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "simpy.*"
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Gateway purity: no LLM-library or network imports"
type = "forbidden"
source_modules = ["src.gateway"]
forbidden_modules = [
    "openai",
    "anthropic",
    "langchain",
    "langchain_core",
    "transformers",
    "httpx",
    "requests",
    "aiohttp",
    "httpcore",
    "urllib",
    "urllib3",
    "socket",
]
