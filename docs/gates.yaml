# gates.yaml — machine-readable mirror of Section 8 gates (schema §8.4)
# Each gate has: id, phase, description, metric, operator, threshold, source_command, raw_output_path

version: "1.0"

gates:
  # === P1 Gates ===
  - id: "G1.1"
    phase: "P1"
    description: "Gateway branch coverage >= 95%"
    metric: "branch_coverage_pct"
    operator: ">="
    threshold: 95
    source_command: "pytest --cov=src/gateway --cov-report=term-missing --cov-branch tests/gateway/"
    raw_output_path: "test_home/P1/G1.1_coverage.txt"

  - id: "G1.2"
    phase: "P1"
    description: "Gateway purity: 1000 repeated calls on the same input give the same output"
    metric: "purity_repetitions_identical"
    operator: "=="
    threshold: 1000
    source_command: "pytest tests/gateway/test_gateway_purity.py -k purity_1000"
    raw_output_path: "test_home/P1/G1.2_purity.txt"

  - id: "G1.3"
    phase: "P1"
    description: "Adversarial corpus >= 60 cases (>= 25 CLIN, >= 15 INJ, >= 10 SCHEMA, >= 5 AUTH, >= 5 IDEM); 100% denied with EXACT reason codes"
    metric: "corpus_cases_denied_exact"
    operator: "=="
    threshold: 80
    source_command: "pytest tests/adversarial/"
    raw_output_path: "test_home/P1/G1.3_corpus.txt"

  - id: "G1.4"
    phase: "P1"
    description: "Deny-by-default: unknown action/schema_id/envelope_type => GW-DEFAULT-001"
    metric: "deny_by_default_count"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/gateway/test_deny_default.py"
    raw_output_path: "test_home/P1/G1.4_deny.txt"

  - id: "G1.5"
    phase: "P1"
    description: "Zero gitleaks findings; secrets baseline committed"
    metric: "gitleaks_findings"
    operator: "=="
    threshold: 0
    source_command: "gitleaks detect --source . --no-banner"
    raw_output_path: "test_home/P1/G1.5_gitleaks.txt"

  - id: "G1.6"
    phase: "P1"
    description: "mypy --strict: 0 errors in core packages"
    metric: "mypy_errors"
    operator: "=="
    threshold: 0
    source_command: "mypy --strict src/contracts src/gateway src/executor src/tokens"
    raw_output_path: "test_home/P1/G1.6_mypy.txt"

  - id: "G1.7"
    phase: "P1"
    description: "import-linter: 0 LLM-library and 0 network imports in the Gateway package"
    metric: "import_linter_violations"
    operator: "=="
    threshold: 0
    source_command: "lint-imports"
    raw_output_path: "test_home/P1/G1.7_import_linter.txt"

  - id: "G1.8"
    phase: "P1"
    description: "Invariant catalog >= 15 invariants, each with a property test (§24.1)"
    metric: "invariant_count"
    operator: ">="
    threshold: 15
    source_command: "pytest tests/property/test_invariants.py"
    raw_output_path: "test_home/P1/G1.8_invariants.txt"

  - id: "G1.9"
    phase: "P1"
    description: "Pre-filter order test (skeleton) passes"
    metric: "prefilter_order_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/unit/test_prefilter.py"
    raw_output_path: "test_home/P1/G1.9_prefilter.txt"

  - id: "G1.10"
    phase: "P1"
    description: "Mutation score on the Gateway package >= 80% (calibrated to 90%)"
    metric: "mutation_score_pct"
    operator: ">="
    threshold: 80
    source_command: "mutmut run --paths-to-mutate src/gateway"
    raw_output_path: "test_home/P1/G1.10_mutmut.txt"

  - id: "G1.11"
    phase: "P1"
    description: "Canonical vectors: 100% of >= 30 vectors reproduce the exact bytes and hash (§24.5)"
    metric: "canonical_vectors_pass_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/test_canonical_vectors.py"
    raw_output_path: "test_home/P1/G1.11_canonical.txt"

  - id: "G1.12"
    phase: "P1"
    description: "Principal-spoofing tests: 100% of attempts to assert an identity through message content are denied (T15)"
    metric: "spoofing_denied_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/adversarial/test_principal_spoof.py"
    raw_output_path: "test_home/P1/G1.12_spoof.txt"

  # === P2 Gates ===
  - id: "G2.1"
    phase: "P2"
    description: "Five agents each produce an independent trace with correlation_id (5/5)"
    metric: "agent_traces"
    operator: "=="
    threshold: 5
    source_command: "pytest tests/agents/test_agents.py -v"
    raw_output_path: "test_home/P2/G2.1_agents.txt"

  - id: "G2.2"
    phase: "P2"
    description: "Durable workflow: kill/restart at >= 5 distinct checkpoints resumes to identical final state hash"
    metric: "checkpoint_resume_hash_match"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/executor/test_executor.py -k checkpoint -v"
    raw_output_path: "test_home/P2/G2.2_executor.txt"

  - id: "G2.3"
    phase: "P2"
    description: "UNKNOWN recovery: 100% of injected timeout cases remain UNKNOWN until reconciliation; 0 converted by timeout alone"
    metric: "unknown_recovery_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/executor/test_executor.py -k unknown -v"
    raw_output_path: "test_home/P2/G2.3_unknown.txt"

  - id: "G2.4"
    phase: "P2"
    description: "Cache binding: 100% of tampered entries (source_hash, claim_span, policy_epoch, window) rejected"
    metric: "tampered_entries_rejected_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/evidence/test_registry.py -v"
    raw_output_path: "test_home/P2/G2.4_cache.txt"

  - id: "G2.5"
    phase: "P2"
    description: "Budget governor: at zero budget, 100% of requests get the deterministic honest fallback with 0 LLM calls"
    metric: "zero_budget_fallback_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/tokens/test_budget.py -v"
    raw_output_path: "test_home/P2/G2.5_budget.txt"

  - id: "G2.6"
    phase: "P2"
    description: "Token baseline measured and stored: tokens-per-capability for every capability exercised so far"
    metric: "token_baseline_stored"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/tokens/test_token_baseline.py -v"
    raw_output_path: "test_home/P2/G2.6_tokens.txt"

  - id: "G2.7"
    phase: "P2"
    description: "Poisoned-source fixtures >= 10; 0 successful indirect injections"
    metric: "poisoned_sources_rejected"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/adversarial/test_poisoned_sources.py -v"
    raw_output_path: "test_home/P2/G2.7_poisoned.txt"

  - id: "G2.8"
    phase: "P2"
    description: "All P1 gates still pass (regression)"
    metric: "p1_regression"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/ -v --tb=short -q"
    raw_output_path: "test_home/P2/G2.8_regression.txt"

  - id: "G2.9"
    phase: "P2"
    description: "Fault injection F01-F08: 100% produce exactly the expected outcome in Section 22"
    metric: "fault_injection_pass_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/fault/ -v"
    raw_output_path: "test_home/P2/G2.9_faults.txt"

  - id: "G2.10"
    phase: "P2"
    description: "LLM replay: a replay miss fails the test in 100% of tested cases; 0 live network calls in the test suite"
    metric: "llm_replay_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/tokens/test_llm_adapter.py -v"
    raw_output_path: "test_home/P2/G2.10_llm.txt"

  # === P3 Gates ===
  - id: "G3.1"
    phase: "P3"
    description: "Replay oracle: 100 seeds x 3 replays => identical state hash in 300/300 runs; tolerance = 0 on the deterministic core"
    metric: "replay_oracle_identical_runs"
    operator: "=="
    threshold: 300
    source_command: "pytest tests/twin/test_simulation.py -k replay -v"
    raw_output_path: "test_home/P3/G3.1_replay.txt"

  - id: "G3.2"
    phase: "P3"
    description: "Each invariant runs >= its minimum Hypothesis cases (§24.1); 0 failures"
    metric: "invariant_hypothesis_failures"
    operator: "=="
    threshold: 0
    source_command: "pytest tests/twin/test_invariants.py -v"
    raw_output_path: "test_home/P3/G3.2_invariants.txt"

  - id: "G3.3"
    phase: "P3"
    description: "Capacity/temporal invariants: 0 violations in >= 10,000 simulated events per scenario"
    metric: "capacity_temporal_violations"
    operator: "=="
    threshold: 0
    source_command: "pytest tests/twin/test_invariants.py -k 'test_10000_events' -v"
    raw_output_path: "test_home/P3/G3.3_capacity.txt"

  - id: "G3.4"
    phase: "P3"
    description: "Delta compression: reconstructed state hash equals the original in 100% of tested snapshots; size reduction reported"
    metric: "delta_reconstruction_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/twin/test_delta.py -v"
    raw_output_path: "test_home/P3/G3.4_delta.txt"

  - id: "G3.5"
    phase: "P3"
    description: "Token benchmark on a fixed 200-request synthetic suite stored in the repo: tokens-avoided, cache-hit-rate, and tokens-per-capability reported; target >= 40% of requests resolved with 0 LLM tokens"
    metric: "token_benchmark_zero_token_rate"
    operator: ">="
    threshold: 40
    source_command: "pytest tests/twin/test_benchmark.py -v"
    raw_output_path: "test_home/P3/G3.5_benchmark.txt"

  - id: "G3.6"
    phase: "P3"
    description: "Uncertainty reporting present in 100% of simulation outputs (interval or explicit 'not estimable' reason)"
    metric: "uncertainty_reporting_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/twin/test_simulation.py -k uncertainty -v"
    raw_output_path: "test_home/P3/G3.6_uncertainty.txt"

  - id: "G3.7"
    phase: "P3"
    description: "Pre-filter order enforced; bypass attempts = 0 successes"
    metric: "prefilter_order_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/unit/test_prefilter.py tests/twin/test_benchmark.py -k 'prefilter or bypass' -v"
    raw_output_path: "test_home/P3/G3.7_prefilter.txt"

  - id: "G3.8"
    phase: "P3"
    description: "All P1-P2 gates still pass (regression)"
    metric: "p1_p2_regression"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/ -v --tb=short -q"
    raw_output_path: "test_home/P3/G3.8_regression.txt"

  - id: "G3.9"
    phase: "P3"
    description: "Cross-environment determinism: the final state hash is identical in two independently built environments (two clean containers)"
    metric: "cross_env_determinism"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/twin/test_simulation.py -k 'deterministic or different_seed' -v"
    raw_output_path: "test_home/P3/G3.9_determinism.txt"

  - id: "G3.10"
    phase: "P3"
    description: "Fault injection F09-F12: 100% produce exactly the expected outcome in Section 22"
    metric: "fault_injection_pass_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/fault/test_fault_f09.py tests/fault/test_fault_f10.py tests/fault/test_fault_f11.py tests/fault/test_fault_f12.py -v"
    raw_output_path: "test_home/P3/G3.10_faults.txt"

  # === P4 Gates ===
  - id: "G4.1"
    phase: "P4"
    description: "Scope completeness: 100% of new/changed capabilities have the Section 29 scope record"
    metric: "scope_completeness_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/p4/test_scope.py -v"
    raw_output_path: "test_home/P4/G4.1_scope.txt"

  - id: "G4.2"
    phase: "P4"
    description: "Source rights and provenance: 100% of active source versions have complete approval, provenance and rights records"
    metric: "source_rights_complete_pct"
    operator: "=="
    threshold: 100
    source_command: "pytest tests/p4/test_source_rights.py -v"
    raw_output_path: "test_home/P4/G4.2_source_rights.txt"

  - id: "G4.3"
    phase: "P4"
    description: "Ingestion security: all declared injection, redirect, oversized-input, unsupported-field and non-English-content fixtures are rejected/quarantined"
    metric: "ingestion_security_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/p4/test_ingestion.py -v"
    raw_output_path: "test_home/P4/G4.3_ingestion.txt"

  - id: "G4.4"
    phase: "P4"
    description: "Memory isolation: all cross-tenant, cross-task and revoked-access fixtures denied; zero unauthorized reads or writes"
    metric: "memory_isolation_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/p4/test_memory.py -v"
    raw_output_path: "test_home/P4/G4.4_memory.txt"

  - id: "G4.5"
    phase: "P4"
    description: "Memory reconstruction: event replay and projection rebuild reproduce expected ordered ids and state hashes exactly"
    metric: "memory_reconstruction_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/p4/test_memory.py -k 'replay or reconstruction or projection' -v"
    raw_output_path: "test_home/P4/G4.5_reconstruction.txt"

  - id: "G4.6"
    phase: "P4"
    description: "Experience promotion: zero unauthorized promotions; every active experience record links to complete evaluation and owner approval"
    metric: "experience_promotion_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/p4/test_experience.py -v"
    raw_output_path: "test_home/P4/G4.6_experience.txt"

  - id: "G4.13"
    phase: "P4"
    description: "Transparency and accounting: all response types contain unified metadata fields; measured reservations reconcile; zero false zero-token claims"
    metric: "transparency_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/p4/test_transparency.py -v"
    raw_output_path: "test_home/P4/G4.13_transparency.txt"

  - id: "G4.14"
    phase: "P4"
    description: "Regression and token evaluation: all final P1-P3 gates pass; original token benchmark rerun separately reported"
    metric: "regression_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/ -v --tb=short -q"
    raw_output_path: "test_home/P4/G4.14_regression.txt"

  - id: "G4.15"
    phase: "P4"
    description: "Regulatory and release applicability: every new/changed capability covered by dated applicability matrix"
    metric: "regulatory_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/p4/test_regulatory.py -v"
    raw_output_path: "test_home/P4/G4.15_regulatory.txt"

  - id: "G4.16"
    phase: "P4"
    description: "Preservation and references: every original requirement maps to a retained final location or explicitly approved replacement; zero unexplained omissions"
    metric: "preservation_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/p4/test_preservation.py -v"
    raw_output_path: "test_home/P4/G4.16_preservation.txt"

  # === P5 Gates ===
  - id: "G4.7"
    phase: "P5"
    description: "Experiment designer: all analytical small reference cases return expected feasible candidates and ranking; prohibited specs denied; replay hashes match"
    metric: "experiment_designer_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/p5/test_experiment.py -v"
    raw_output_path: "test_home/P5/G4.7_experiment.txt"

  - id: "G4.8"
    phase: "P5"
    description: "Evidence impact: all fixture-defined affected artifacts identified; unrelated unflagged; historical signed bytes unchanged; cycles rejected"
    metric: "evidence_impact_pass"
    operator: "=="
    threshold: 1
    source_command: "pytest tests/p5/test_impact.py -v"
