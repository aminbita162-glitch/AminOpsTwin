    operator: "=="
    threshold: 1
    source_command: "pytest tests/p6/test_integrity.py tests/p6/test_scheduler.py -v"
    raw_output_path: "test_home/P6/G4.11_integrity.txt"

  # === P7 Gates ===
  - id: "G4.12"
