# Regulatory Applicability Matrix (§29, G4.15)
#
# Dated applicability assessment for AminOpsTwin operational capabilities.
# This is an evidence task, not a claim that all EU/German legal requirements
# have been certified. An independent competent review of the actual product,
# interfaces, intended use and sales claims is required before commercial
# release. Unresolved classification is recorded; the affected release/use
# is not declared approved. Legal review cannot be replaced by a keyword
# scanner or an LLM vote.
#
# Reference date: October 23, 2026. Recheck current versions and terms at
# activation and before release.

version: "1.0"
assessment_date: "2026-10-23"
scope: "AminOpsTwin — Operational Cognitive Digital Twin for Clinical Research Operations (non-medical)"

applicable_regulations:
  - regulation: "MDR Regulation (EU) 2017/745"
    source_url: "https://eur-lex.europa.eu/eli/reg/2017/745/oj/eng"
    applicability: "not-applicable-pending-review"
    rationale: >-
      AminOpsTwin is a non-medical operational planning tool. It does not
      perform diagnosis, prognosis, treatment recommendation, or individual
      risk scoring. MDR qualification requires independent legal review of
      the actual product and intended use. Engineering testing is not legal
      clearance. Status is not-applicable-pending-review, not excluded_confirmed.

  - regulation: "EU AI Act Regulation (EU) 2024/1689"
    source_url: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng"
    applicability: "undetermined"
    rationale: >-
      AI Act applicability depends on the final intended use, risk
      classification, and deployment context. Not determined at P4
      engineering stage. Requires independent legal review before
      commercial release.

  - regulation: "GDPR (Regulation (EU) 2016/679)"
    source_url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"
    applicability: "applicable"
    rationale: >-
      Account/telemetry data and operational usage data may be personal data
      under GDPR even though patient data is prohibited. Applicable obligations
      are not excluded by naming them out of scope. Deployment must implement
      data protection by design and by default.

  - regulation: "Cybersecurity (NIS2 Directive 2022/2555)"
    source_url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj/eng"
    applicability: "undetermined"
    rationale: >-
      Applicability depends on deployment context and whether the operator
      falls under essential/important entity classification. Not determined
      at P4 engineering stage.

  - regulation: "German MDR/VdM implementation context"
    source_url: ""
    applicability: "undetermined"
    rationale: >-
      German national implementation and applicable deployment law require
      independent review of the actual deployment. Not determined at P4
      engineering stage.

