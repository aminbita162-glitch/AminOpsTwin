# claims.yaml — Evidence Claim Registry (Idea S1, P13, G13.1)
#
# Every claim in README.md that makes a capability assertion has a
# claim-id.  Each claim-id maps to an evidence-path (a file whose
# existence and content supports the claim) and the SHA-256 hash of
# that evidence file.
#
# The standalone CLI tool `scripts/aminopstwin-verify` checks any
# claim-id without running the full system: it recomputes the hash
# of the evidence-path and compares it to the recorded hash.
#
# Schema:
#   claim_id:   unique identifier referenced in README.md as [CLAIM-NNN]
#   text:       the claim sentence (human-readable)
#   evidence_path: relative path from repo root to the evidence file
#   hash:       SHA-256 hex of the evidence file content
#   category:   claim category (capability, safety, boundary, architecture)

