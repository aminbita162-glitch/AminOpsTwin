    scope: "src.contracts.envelope"
    category: "envelope/canonicalization round-trip"
    severity: "BLOCKING"
    property_test: "tests/property/test_invariants.py::test_payload_hash_matches_canonical"
    min_generated_cases: 1000
    counterexample_policy: "store the failing seed in test_home/P1/"

