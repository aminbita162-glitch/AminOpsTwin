# invariant_catalog.yaml (§5.1, §9.4)
# Formal invariant catalog with property-based tests (Hypothesis; contract in §24.1).
# Created by the agent in P1 (>= 15 invariants), approved by the owner at the P1
# Hard Stop, then versioned; changes need owner approval.
# Any invariant failure blocks the phase.

version: "1.0"

invariants:
