# Alembic configuration for AminOpsTwin (P27).
# Migrations are run with: alembic upgrade head
# The database URL comes from the environment (PGHOST, PGPORT, etc.).

[alembic]
script_location = migrations
sqlalchemy.url = postgresql+psycopg://

[loggers]
keys = root,sqlalchemy,alembic

[handlers_root]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = simple

[formatters_simple]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[logger_root]
level = WARN
handlers = root
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
